# 敦煌金 AI 设计平台 - Docker Compose 配置
# 使用方法: docker-compose up -d

version: '3.8'

services:
  # 主应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dunhuang-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - COZE_PROJECT_ENV=PROD
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
    env_file:
      - .env.local
    depends_on:
      - db
      - redis
    networks:
      - dunhuang-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Worker：异步生成编排执行（独立镜像，最小化）
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dunhuang-worker
    restart: unless-stopped
    command: ["node", "dist-workers/orchestrator-worker.js"]
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dunhuang-network

  # 健康检查 Worker：定时探测系统依赖 + 告警（L5 运维）
  health-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dunhuang-health-worker
    restart: unless-stopped
    command: ["node", "dist-workers/health-worker.js"]
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - COMFYUI_HOST=${COMFYUI_HOST:-http://comfyui:8188}
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-60000}
      - HEALTH_ALERT_THRESHOLD=${HEALTH_ALERT_THRESHOLD:-2}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dunhuang-network
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: dunhuang-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dunhuang}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dunhuang-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（可选，用于会话和缓存）
  redis:
    image: redis:7-alpine
    container_name: dunhuang-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - dunhuang-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx 反向代理（可选，用于 HTTPS）
  nginx:
    image: nginx:alpine
    container_name: dunhuang-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - dunhuang-network

networks:
  dunhuang-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
