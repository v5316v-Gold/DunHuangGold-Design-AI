---
# Phase 1 · Runtime Stack
# 5 容器: web / worker / postgres / redis / [comfyui 可选]
# 服务名连接 (postgres, redis)；不用 localhost / WSL IP
# 健康检查 + restart: unless-stopped
# 数据持久化: named volumes
# 移除 1Panel: 这套 compose 独立于 1Panel 管理

# 启动: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# 停止: docker compose down
# 数据删除: docker compose down -v (慎用!)

name: dunhuang-ai

services:
  # ===== PostgreSQL =====
  postgres:
    # 用 1Panel 已有的 postgres:18.4-alpine（避免重新拉取 + 与现有 volume 兼容）
    image: postgres:18.4-alpine
    container_name: dunhuang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dunhuang1
      POSTGRES_PASSWORD: dunhuang2026
      POSTGRES_DB: dunhuang
    volumes:
      # PG 18+ 推荐挂到 /var/lib/postgresql（容器自己管 subdir），不要直挂 data 子目录
      - postgres_data:/var/lib/postgresql
      - ./src/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # dev 环境固定端口（pnpm dev 需要 localhost 连接）
      # 注意：Docker Desktop + WSL2 下用 0.0.0.0 比 127.0.0.1 端口转发更可靠
      - "0.0.0.0:5432:5432"
    networks:
      - dunhuang-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dunhuang1 -d dunhuang"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    # 原 dunhuang-redis 与 1Panel 容器同名冲突 → 用 compose 后缀区分（不影响服务名 redis）
    container_name: dunhuang-redis-compose
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "0.0.0.0:6379:6379"
    networks:
      - dunhuang-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ===== Web (Next.js) =====
  web:
    # 本地构建（docker compose up -d --build）；镜像 tag 与构建产物绑定
    image: dunhuang-web:v1.22
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    container_name: dunhuang-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # 关键修复：Next standalone server.js 用 process.env.HOSTNAME || '0.0.0.0'
      # Docker 默认把 HOSTNAME 设为容器 ID，导致监听容器 IP 而非 0.0.0.0
      # → healthcheck 用 localhost 连不上。这里显式覆盖为 0.0.0.0
      HOSTNAME: 0.0.0.0
      ENTRYPOINT_MIGRATE: "1"
      RUN_SEED: "${RUN_SEED:-0}" 
      # 数据库用服务名 postgres（compose 网络直连），不被 env 变量覆盖
      DATABASE_URL: postgresql://dunhuang1:dunhuang2026@postgres:5432/dunhuang
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      # 容器内必须用 host.docker.internal（127.0.0.1 = 容器自身）
      COMFYUI_HOST: http://host.docker.internal:8188
      MINIMAX_API_BASE: ${MINIMAX_API_BASE:-https://api.minimax.chat/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      MESHY_API_KEY: ${MESHY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:5000}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dunhuang-net
    # P0-3: liveness 用 /api/ping（永远 200，避免依赖降级误触发重启）
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # 重启策略: app code 必须能处理 DB/Redis 重连
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ===== Worker (BullMQ consumer) =====
  worker:
    # 本地构建（docker compose up -d --build）
    image: dunhuang-worker:v1.19
    build:
      context: .
      dockerfile: Dockerfile.worker
    pull_policy: never
    container_name: dunhuang-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dunhuang1:dunhuang2026@postgres:5432/dunhuang
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      # 容器内必须用 host.docker.internal（127.0.0.1 = 容器自身，连不上宿主机 ComfyUI）
      COMFYUI_HOST: http://host.docker.internal:8188
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      MESHY_API_KEY: ${MESHY_API_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:5000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - dunhuang-net
    # worker 无 HTTP 端口：healthcheck 检查进程存活（node 退出码探测）
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===== ComfyUI (可选 - GPU 节点) =====
  # 默认注释掉；本地有 GPU 时取消注释
  # comfyui:
  #   image: comfyui/comfyui:latest-cpu
  #   container_name: dunhuang-comfyui
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8188:8188"
  #   volumes:
  #     - comfyui_models:/home/comfyui/ComfyUI/models
  #   networks:
  #     - dunhuang-net
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  postgres_data:
    name: dunhuang-postgres-data
  redis_data:
    name: dunhuang-redis-data
  # comfyui_models:
  #   name: dunhuang-comfyui-models

networks:
  dunhuang-net:
    name: dunhuang-net
    driver: bridge
