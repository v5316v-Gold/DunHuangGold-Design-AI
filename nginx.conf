# ============================================================
# 敦煌金 AI 平台 - nginx 反向代理模板(W4)
# ============================================================
# 支持:
#   1. HTTP → HTTPS 自动 301
#   2. 自签证书占位 / Let's Encrypt 占位(/etc/nginx/ssl/)
#   3. Web(5000)+ Worker stdout(无 HTTP,健康用 :5000/api/ping)+ MinIO(9000)
#   4. SSE(/api/tasks/[id]/stream)/ WebSocket 兼容:Connection upgrade
#   5. /admin IP 白名单(LAN 网段,可配置)
#   6. 单 IP 限速(防爆破 + 流量滥用)
#   7. 全量安全响应头
#   8. SSE 关闭缓冲:proxy_buffering off (不然 Next SSE 会被截断)
#
# 使用:
#   docker run -d --name dunhuang-nginx \
#     -p 80:80 -p 443:443 \
#     -v $PWD/nginx.conf:/etc/nginx/nginx.conf:ro \
#     -v $PWD/ssl:/etc/nginx/ssl:ro \
#     --network dunhuang-net \
#     nginx:1.27-alpine
# ============================================================

# ================ 主配置 ================
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 性能优化
    sendfile                on;
    tcp_nopush              on;
    tcp_nodelay             on;
    keepalive_timeout       65;
    types_hash_max_size      2048;
    server_tokens            off;
    client_max_body_size    60M;

    # 日志格式:含真实 IP(在有 X-Forwarded-For 的代理后)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # gzip
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     5;
    gzip_min_length     1024;
    gzip_types          application/javascript text/css application/json application/xml application/xml+rss text/plain application/font-woff2 image/svg+xml;

    # 限流 keys
    limit_req_zone $binary_remote_addr zone=lan_writes:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=lan_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=lan_admin:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=lan_conn:10m;

    # ================ Upstream ================
    upstream next_app {
        server dunhuang-web:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # ================ 80 → 443 ================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME http-01 challenge 直通(若用 certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 健康探测(80 也响应,适合外层 LB)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ================ 443 ================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;

        # 自签证书 / Let's Encrypt 占位
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ================ 安全响应头 ================
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        # CSP 兼容:shadcn/ui + Next.js 需要 'unsafe-inline' 'unsafe-eval'
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; form-action 'self';" always;

        # 客户端上传大小(Next 已 4.5MB Body,默认 1MB 不够)
        client_max_body_size 60M;
        client_body_buffer_size 128k;
        proxy_buffering off;

        # ================ 健康端点(无 auth) ================
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ================ SSE 任务流(关闭代理缓冲) ================
        location ~ ^/api/tasks/[0-9a-f-]+/stream$ {
            limit_req zone=lan_writes burst=10 nodelay;
            proxy_pass http://next_app;

            # SSE 必须:关闭 buffer + 关闭 cache
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 7m;
            proxy_send_timeout 7m;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ================ 后台管理员路径:IP 白名单 ================
        # LAN 网段默认放行(192.168/16, 10/8, 172.16/12)
        # 通过环境变量 SUBSTITUTE_IP_ALLOWLIST 可覆盖
        location ^~ /admin/api/ {
            # 内置 LAN 白名单,亦可在外部 LB / WAF 收紧
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            allow ::1;
            deny  all;

            limit_req zone=lan_admin burst=20 nodelay;
            limit_conn lan_conn 50;
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        # ================ 登录(login / auth/*) ================
        location ~ ^/(api/auth/login|api/auth/register) {
            limit_req zone=lan_login burst=5 nodelay;
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ================ 写操作限流 ================
        location ~ ^/api/.*$ {
            limit_req zone=lan_writes burst=40 nodelay;
            limit_conn lan_conn 200;

            # 普通 Next 路由
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # ================ 静态资源 ================
        location /_next/static {
            proxy_pass http://next_app;
            proxy_cache_valid 200 365d;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /static {
            proxy_pass http://next_app;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }

        # ================ 前台页面 ================
        location / {
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
